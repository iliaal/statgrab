name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer validate --strict

  pie-smoke:
    name: PIE install smoke
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: phpize, php-config
          coverage: none
      - name: Install PIE build prerequisites + libstatgrab-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison libtool-bin libstatgrab-dev pkg-config
      - name: Download PIE
        run: |
          curl -fsSL -o /tmp/pie.phar https://github.com/php/pie/releases/latest/download/pie.phar
          chmod +x /tmp/pie.phar
      - name: PIE build smoke
        run: |
          php /tmp/pie.phar repository:add path .
          php /tmp/pie.phar build iliaal/statgrab:*@dev

  # ASAN_OPTIONS detect_leaks=0 below means leaks gate solely via asan-bundled.
  linux:
    name: PHP ${{ matrix.php }} - Linux NTS
    runs-on: ubuntu-22.04
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libstatgrab
        run: sudo apt-get update && sudo apt-get install -y libstatgrab-dev pkg-config

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Test custom-prefix configure checks
        run: sh tests/configure-prefix.sh

      - name: Build extension
        run: |
          phpize
          ./configure --with-statgrab
          make -j$(nproc)

      - name: Run test suite
        env:
          NO_INTERACTION: 1
          ASAN_OPTIONS: detect_leaks=0
        run: |
          export TEST_PHP_EXECUTABLE=$(which php)
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/statgrab.so"
          php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  linux-php86:
    name: PHP 8.6 - Linux NTS (PHP-8.6 branch)
    runs-on: ubuntu-22.04
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build deps + libstatgrab
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c bison autoconf automake libtool \
                                  pkg-config libxml2-dev libsqlite3-dev libstatgrab-dev

      - name: Build PHP 8.6 from the PHP-8.6 branch
        run: |
          git clone --depth=1 --branch=PHP-8.6 https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          ./configure --disable-zts --disable-all --enable-cli \
                      --disable-cgi --disable-phpdbg --prefix=/tmp/php-86
          make -j$(nproc)
          make install

      - name: Build extension
        run: |
          export PATH="/tmp/php-86/bin:$PATH"
          phpize
          ./configure --with-statgrab --with-php-config=/tmp/php-86/bin/php-config
          make -j$(nproc)

      - name: Run test suite
        env:
          NO_INTERACTION: 1
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-86/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/statgrab.so"
          /tmp/php-86/bin/php run-tests.php --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  asan-bundled:
    name: PHP 8.4 - ASAN (bundled libstatgrab)
    runs-on: ubuntu-22.04
    needs: validate
    env:
      ASAN_OPTIONS: exitcode=139:detect_odr_violation=0:detect_leaks=1:fast_unwind_on_malloc=0
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan.supp:print_suppressions=0
      UBSAN_OPTIONS: print_stacktrace=1
      USE_ZEND_ALLOC: 0
      NO_INTERACTION: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang re2c bison autoconf automake libtool \
                                  pkg-config libxml2-dev libsqlite3-dev

      - name: Resolve clang runtime dir
        id: clang_rt
        run: echo "dir=$(clang -print-runtime-dir)" >> "$GITHUB_OUTPUT"

      - name: Build PHP 8.4 with ASan
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          git clone --depth=1 --branch=PHP-8.4 https://github.com/php/php-src.git /tmp/php-src
          cd /tmp/php-src
          ./buildconf --force
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure --enable-debug --disable-zts --disable-all --enable-cli \
                      --disable-cgi --disable-phpdbg --prefix=/tmp/php-asan
          make -j$(nproc)
          make install

      - name: Build bundled libstatgrab (static, PIC)
        run: |
          cd vendor/libstatgrab
          autoreconf -fiv
          ./configure --enable-static --disable-shared --without-ncurses --with-pic
          make -j$(nproc)

      - name: Build extension against bundled libstatgrab
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          export PATH="/tmp/php-asan/bin:$PATH"
          phpize
          CC=clang CXX=clang++ \
          CFLAGS="-fsanitize=address,undefined -fno-sanitize=function,vptr -shared-libasan -DZEND_TRACK_ARENA_ALLOC" \
          LDFLAGS="-fsanitize=address,undefined -shared-libasan" \
          ./configure --with-statgrab=bundled --with-php-config=/tmp/php-asan/bin/php-config
          make -j$(nproc)

      - name: Run test suite under ASan + LeakSanitizer
        env:
          LD_LIBRARY_PATH: ${{ steps.clang_rt.outputs.dir }}
        run: |
          export TEST_PHP_EXECUTABLE=/tmp/php-asan/bin/php
          export TEST_PHP_ARGS="-d extension=$(pwd)/modules/statgrab.so"
          /tmp/php-asan/bin/php run-tests.php --asan --show-diff -g FAIL,BORK,LEAK,XLEAK tests/

  gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [linux, linux-php86, asan-bundled, pie-smoke]
    if: always()
    steps:
      - name: Check required jobs
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          LINUX_PHP86_RESULT: ${{ needs.linux-php86.result }}
          ASAN_RESULT: ${{ needs.asan-bundled.result }}
          PIE_RESULT: ${{ needs.pie-smoke.result }}
        run: |
          test "$LINUX_RESULT" = "success"
          test "$LINUX_PHP86_RESULT" = "success"
          test "$ASAN_RESULT" = "success"
          test "$PIE_RESULT" = "success"
